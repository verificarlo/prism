name: release-binaries

on:
  release:
    types: [published, created, prereleased]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: linux-${{ matrix.arch }}-llvm${{ matrix.llvm }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        llvm:
          - 17
          - 18
          - 19
          - 20
        arch:
          - x86-64
          - x86-64-v2
          - x86-64-v3
          - x86-64-v4

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ matrix.llvm }}

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libtinfo5 parallel patchelf

      - name: Configure for ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ./autogen.sh
          ./configure --prefix=/usr --with-arch="${{ matrix.arch }}"

      - name: Build
        run: make

      - name: Package binary distribution
        env:
          PRISM_ARCH: ${{ matrix.arch }}
          PRISM_LLVM: ${{ matrix.llvm }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' VERSION)"
          fi

          package_name="prism-${version}-linux-${PRISM_ARCH}-llvm${PRISM_LLVM}"
          stage_root="$RUNNER_TEMP/stage"
          package_root="$RUNNER_TEMP/$package_name"
          mkdir -p "$stage_root/usr/lib" "$stage_root/usr/include" "$package_root"

          make DESTDIR="$stage_root" install
          cp -a "$stage_root/usr/include" "$package_root/include"
          cp -a "$stage_root/usr/lib" "$package_root/lib"

          static_libraries=(
            bazel-bin/src/libprism-dynamic.a
            bazel-bin/src/libprism-dynamic-dbg.a
            bazel-bin/src/libprism-static.a
            bazel-bin/src/libprism-static-dbg.a
            bazel-bin/external/+_repo_rules+hwy/libhwy.a
          )
          for library in "${static_libraries[@]}"; do
            test -f "$library"
            install -m 0644 "$library" "$package_root/lib"
          done

          for library in "$package_root"/lib/libprism-*.so; do
            patchelf --add-needed libhwy.so --set-rpath '$ORIGIN' "$library"
          done

          documentation_root="$package_root/share/doc/prism"
          mkdir -p "$documentation_root"
          install -m 0644 LICENSE README.md "$documentation_root"
          cat <<EOF | sed 's/^[[:space:]]*//' > "$documentation_root/BUILD-INFO.txt"
          PRISM version: $version
          Target architecture: $PRISM_ARCH
          Operating system: Linux
          Build image: ubuntu-22.04
          LLVM version: $PRISM_LLVM
          Source revision: $GITHUB_SHA
          EOF

          test -f "$package_root/lib/libprism-dynamic.so"
          test -f "$package_root/lib/libprism-static.so"
          test -f "$package_root/include/prism_api.h"
          test -f "$package_root/include/prism-dynamic.ll"
          test -f "$package_root/include/prism-static.ll"
          test -f "$documentation_root/BUILD-INFO.txt"

          for library in "$package_root"/lib/libprism-*.so; do
            LD_LIBRARY_PATH="$package_root/lib" \
              python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$library"
          done

          mkdir -p dist
          tar --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -czf "dist/${package_name}.tar.gz" "$package_name"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-${{ matrix.arch }}-llvm${{ matrix.llvm }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: attach-release-assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: prism-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
