name: docker

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  release:
    types: [published]

jobs:
  llvm_latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "20"
      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget http://ftp.us.debian.org/debian/pool/main/n/ncurses/libtinfo5_6.4-4_amd64.deb
          sudo dpkg -i libtinfo5_6.4-4_amd64.deb
      - name: autogenerate
        run: ./autogen.sh
      - name: configure
        run: ./configure && cat config.log
      - name: make
        run: make
      - name: Run tests
        run: bazel test --test_output=errors tests:all

  llvm_all:
    if: github.event_name == 'pull_request' || github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            llvm: 17
          - os: ubuntu-24.04
            llvm: 18
          - os: ubuntu-24.04
            llvm: 19
          - os: ubuntu-24.04
            llvm: 20

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ matrix.llvm }}
      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Set up environment
        run: |
          sudo apt-get update
            sudo apt-get install -y wget
            if [ "${{ runner.arch }}" = "X64" ]; then
              wget http://security.debian.org/debian-security/pool/updates/main/n/ncurses/libtinfo5_6.1+20181013-2+deb10u5_amd64.deb
            elif [ "${{ runner.arch }}" = "ARM64" ]; then
              wget http://security.debian.org/debian-security/pool/updates/main/n/ncurses/libtinfo5_6.1+20181013-2+deb10u5_arm64.deb
            fi
          sudo dpkg -i libtinfo5_6.1+20181013-2+deb10u5_amd64.deb
      - name: autogenerate
        run: ./autogen.sh
      - name: configure
        run: ./configure && cat config.log
      - name: Run tests
        run: bazel test --test_output=errors tests:all
